name: Claude Code

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract base branch from issue title
        id: extract_branch
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # If the title follows the format "[branch name] body text," extract that part as the base branch.
          if [[ "$ISSUE_TITLE" =~ ^\[([^]]+)\] ]]; then
            echo "branch_name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "branch_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: ${{ steps.extract_branch.outputs.branch_name }}
          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          claude_args: '--allowedTools "Skill,Bash(npm test:*),Bash(npm run lint:*)"'

      - name: Create Pull Request
        if: steps.claude.outputs.conclusion == 'success' && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE_BRANCH: ${{ steps.extract_branch.outputs.branch_name || github.event.repository.default_branch }}
        run: |
          # Claude pushes its changes to HEAD_BRANCH but doesn't open a PR itself; skip if one already exists for this branch.
          if [ -z "$(gh pr list --head "$HEAD_BRANCH" --json number --jq '.[0].number')" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --fill
          fi
