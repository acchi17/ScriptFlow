name: Claude Code Reminder
on:
  schedule:
    - cron: "0 18 * * 0-4"
  workflow_dispatch:

jobs:
  find-targets:
    uses: ./.github/workflows/find-targets.yml

  remind:
    needs: find-targets
    if: needs.find-targets.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.find-targets.outputs.targets) }}
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: ${{ matrix.branch }}
          prompt: |
            Read every .md file under doc/design/draft/ and identify all design considerations whose status is marked exactly as "[Open]".
            Pick only the single most important one from those "[Open]" items and post a reminder about it as a
            comment on Issue #${{ matrix.issue }} (use gh issue comment).
            How to pick (in priority order):
            1. It blocks other decisions or implementation work (nothing can move
               forward until it is decided)
            2. It has a wide impact (affects multiple files or modules)
            3. It would be costly to change later
            Comment requirements:
            - Mention @${{ needs.find-targets.outputs.remind_user }} at the beginning
            - For the selected point, briefly describe the file name and location,
              what needs to be decided, the options and their trade-offs, and your
              recommendation
            - Briefly explain why you picked this point (e.g. what it is blocking)
            - At the end, note that this is "1 of N open points"
            - If there are no "[Open]" items, do not post anything
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(gh issue comment:*)"
