name: Commit and open PR
description: Commit the staged changes to a new branch, force-push it and open a pull request
inputs:
  branch:
    description: Branch to create and push
    required: true
  base:
    description: Branch the pull request targets
    required: true
  commit-message:
    required: true
  pr-title:
    required: true
  pr-body:
    required: true
  token:
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Commit, push and open PR
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "$BRANCH"
        git commit -m "$COMMIT_MESSAGE"
        # Force-push: the branch may remain from a previously closed (unmerged) PR
        # An earlier AI agent step may leave a revoked token in git config, so push with the job's own token instead
        git config --local --unset-all http.https://github.com/.extraheader || true
        git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$BRANCH"
        gh pr create --base "$BASE" --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
